<!-- Leaflet 1.9.4 desde el CDN oficial (unpkg), con integrity -->

<!-- Fuentes: Google Fonts, solo los pesos usados -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #070a10;
        --panel: rgba(14, 19, 28, 0.88);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #e6ecf2;
        --text-muted: #7c8796;
        --cyan: #00f3ff;
        --amber: #ffaa00;
        --red: #ff003c;
    }

    * { box-sizing: border-box; }

    /* Sin barras de scroll visibles EN NINGÚN SITIO (dashboard, chat,
       modales, avisos...). El scroll táctil/de rueda sigue funcionando. */
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }

    html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    h1, h2, h3, .display { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.02em; }
    code, .mono, .quantum-log-section pre, .log-line { font-family: 'JetBrains Mono', monospace; }

    /* ---------- Sistema de esquinas (nada se solapa con nada) ----------
       Arriba-izquierda : controles del mapa (zoom, ubicación, capas, FWI),
                          apilados por el propio Leaflet en flujo: imposible
                          que choquen entre sí. Selector de idioma al lado.
       Arriba-derecha   : dashboard (deja libre la franja del FAB de chat).
       Abajo-derecha    : chat (FAB + panel). Solo la fina barra de
                          atribución vive bajo el FAB, sin tocarse.
       Abajo-izquierda  : raíl de herramientas (emergencia → bandas →
                          recursos) + píldora PWA a la derecha de emergencia.
       Centro-arriba    : badge de conexión / alertas.
       Escala z-index: 1 mapa · 500 dashboard · 600 chat/bandas · 1000
       recursos · 1800 PWA · 1900 hoja móvil · 2000 toasts · 2500 evac ·
       99998 emergencia · 100000 modal legal. */

    #map { position: absolute; inset: 0; z-index: 1; }

    /* Controles Leaflet con el mismo cristal oscuro que el dashboard */
    .leaflet-bar, .leaflet-control-layers {
        background: var(--panel) !important; color: var(--text);
        border: 1px solid var(--panel-border) !important;
        border-radius: 10px !important; overflow: hidden;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.35) !important;
    }
    .leaflet-bar a {
        background: transparent; color: var(--text);
        border-bottom: 1px solid var(--panel-border);
        transition: background 0.15s ease, color 0.15s ease;
    }
    .leaflet-bar a:last-child { border-bottom: none; }
    .leaflet-bar a:hover, .leaflet-bar a:focus { background: rgba(255,255,255,0.07); color: var(--cyan); }
    .leaflet-control-layers-toggle { filter: invert(1); }
    .leaflet-control-layers-expanded { padding: 10px 12px; color: var(--text); background: var(--panel); }
    .leaflet-control-layers label {
        display: flex; align-items: center; gap: 8px;
        padding: 4px 0; margin: 0; font-family: 'Inter', sans-serif;
        font-size: 0.78rem; cursor: pointer; white-space: nowrap;
    }
    .leaflet-control-layers-selector { margin: 0; accent-color: var(--cyan); }
    .leaflet-control-layers-separator { border-top: 1px solid var(--panel-border); margin: 6px -12px; }
    .leaflet-container .leaflet-control-attribution {
        background: rgba(7,10,16,0.55); color: var(--text-muted);
        font-size: 10px; padding: 2px 8px; border-radius: 8px 0 0 0;
    }
    .leaflet-container .leaflet-control-attribution a { color: var(--text-muted); }

    /* ---------- Selector de idioma ---------- */
    #language-select-wrap {
        position: absolute; top: 16px; left: 66px; z-index: 500;
    }
    #language-select {
        background: var(--panel); color: var(--text);
        border: 1px solid var(--panel-border); border-radius: 8px;
        padding: 8px 12px; font-family: 'Inter', sans-serif; font-size: 0.85rem;
        backdrop-filter: blur(8px);
    }

    /* ---------- Dashboard principal ---------- */
    #dashboard {
        position: absolute; top: 16px; right: 16px; z-index: 500;
        width: 340px;
        /* La franja inferior derecha (84px) queda reservada al FAB de chat:
           el panel nunca baja lo suficiente como para tocarlo. */
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4);
        transition: transform 0.25s ease, opacity 0.25s ease;
        padding: 18px;
    }
    #dashboard.closed { transform: translateX(120%); opacity: 0; pointer-events: none; }

    #dashboard.estado-reposo { border-color: rgba(0,243,255,0.35); }
    #dashboard.estado-ambar  { border-color: rgba(255,170,0,0.45); }
    #dashboard.estado-rojo   { border-color: rgba(255,0,60,0.5); }

    .dashboard-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .dashboard-header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo { width: 26px; height: 26px; flex: 0 0 auto; filter: drop-shadow(0 2px 6px rgba(255,107,0,0.35)); }
    .dashboard-header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; white-space: nowrap; }
    .dashboard-header h1 span { color: var(--cyan); }

    /* Anillo de foco elegante (accesibilidad sin romper el estilo) */
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(0,243,255,0.28);
        border-radius: 8px;
    }

    .icon-btn {
        background: transparent; border: 1px solid var(--panel-border);
        color: var(--text-muted); border-radius: 8px; width: 30px; height: 30px;
        cursor: pointer; font-size: 0.9rem; line-height: 1;
        transition: transform 0.15s ease, box-shadow 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:hover {
        color: var(--text); border-color: var(--text-muted);
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(0,0,0,0.35);
    }
    .icon-btn:active { transform: translateY(0); box-shadow: none; }

    #reopen-dashboard-btn {
        display: none; position: absolute; top: 16px; right: 16px; z-index: 500;
        background: var(--panel); border: 1px solid var(--panel-border);
        color: var(--text); border-radius: 10px; padding: 10px 14px; cursor: pointer;
        backdrop-filter: blur(10px);
    }

    .mode-toggle-row { margin-bottom: 14px; }
    /* Interruptor de modo: el punto de la izquierda indica el estado actual
       (cian = científico, ámbar = ciudadano); el texto dice a cuál cambias. */
    #toggle-mode {
        width: 100%; padding: 9px 12px; border-radius: 10px;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.03); color: var(--text);
        font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em;
        cursor: pointer; display: flex; align-items: center; gap: 10px;
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    #toggle-mode::before {
        content: ''; width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
        background: var(--cyan); box-shadow: 0 0 6px rgba(0,243,255,0.6);
        transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    #dashboard.mode-citizen #toggle-mode::before {
        background: var(--amber); box-shadow: 0 0 6px rgba(255,170,0,0.6);
    }
    #toggle-mode:hover { border-color: var(--text-muted); background: rgba(255,255,255,0.05); }

    .readout-coords { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; }

    .percent-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    #ui-percent { font-size: 2.4rem; font-weight: 700; font-family: 'Rajdhani', sans-serif; }
    #ui-alert {
        font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
        padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.06);
    }
    .estado-reposo #ui-percent, .estado-reposo #ui-alert { color: var(--cyan); }
    .estado-ambar #ui-percent, .estado-ambar #ui-alert { color: var(--amber); }
    .estado-rojo #ui-percent, .estado-rojo #ui-alert { color: var(--red); }

    #ui-action { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 14px; }

    .clima-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
        font-size: 0.8rem; margin-bottom: 14px;
    }
    .clima-grid div span.label { color: var(--text-muted); display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }

    #ui-propagacion-texto {
        font-size: 0.8rem; line-height: 1.5; color: var(--text);
        background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px;
        margin-bottom: 14px; white-space: pre-line;
    }

    #ui-ciencia-texto {
        font-size: 0.78rem; line-height: 1.6; color: var(--text);
        background: rgba(0,243,255,0.05);
        border: 1px solid rgba(0,243,255,0.18);
        border-radius: 8px; padding: 10px;
        margin-bottom: 14px; white-space: pre-line;
    }
    #ui-ciencia-texto:empty { display: none; }

    #contador-fuegos {
        font-size: 0.78rem; color: var(--red); margin-bottom: 14px;
        border-left: 2px solid var(--red); padding-left: 8px;
    }

       /* ---------- Log cuántico ---------- */
    #quantum-log-section {
        border-top: 1px solid var(--panel-border); 
        padding-top: 12px; 
        margin-bottom: 14px; 
    }
    /* Modo ciudadano (simplificado): se oculta el registro cuántico.
       Por defecto (sin la clase) estás en modo científico y se ve. */
    #dashboard.mode-citizen #quantum-log-section { display: none; }
    #quantum-log-section h2 {
        font-size: 0.85rem; margin: 0 0 8px 0; color: var(--cyan);
        display: flex; justify-content: space-between; align-items: center;
        cursor: pointer; /* ← Esto añade la manita al pasar el ratón por encima */
    }
    #quantum-log-section .log-line {
        font-size: 0.7rem; color: var(--text-muted); line-height: 1.6;
        margin-bottom: 6px; overflow-wrap: break-word;
    }
    #quantum-log-section.section-collapsed .log-line { display: none; }
    #quantum-log-section h2 .ql-ind { display: inline-block; transition: transform 0.2s ease; }
    #quantum-log-section.section-collapsed h2 .ql-ind { transform: rotate(-90deg); }


    .btn-primary {
        width: 100%; padding: 10px; border-radius: 10px; border: none;
        background: var(--cyan); color: #051013; font-weight: 600; cursor: pointer;
        font-family: 'Rajdhani', sans-serif; letter-spacing: 0.02em; font-size: 0.9rem;
        margin-bottom: 8px;
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,243,255,0.28); }
    .btn-primary:active { transform: translateY(0); box-shadow: none; }

    #open-legal-link { display: block; text-align: center; font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }

    /* ---------- Chat Manolito ---------- */
    #manolito-toggle-btn {
        /* Esquina inferior derecha, su sitio estándar: el selector de capas
           vive ahora arriba a la izquierda y la barra de atribución (~14px)
           pasa por debajo sin tocarse. */
        position: absolute; bottom: 18px; right: 12px; z-index: 600;
        width: 56px; height: 56px; border-radius: 50%; border: none;
        background: var(--cyan); color: #051013; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 20px rgba(0,243,255,0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #manolito-toggle-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,243,255,0.45); }
    #manolito-toggle-btn:active { transform: translateY(0); }
    #manolito-toggle-btn svg { width: 26px; height: 26px; }

    #manolito-panel {
        position: absolute; bottom: 86px; right: 12px; z-index: 600;
        width: 340px; height: 460px; max-height: 70vh;
        background: var(--panel); border: 1px solid var(--panel-border);
        border-radius: 16px; backdrop-filter: blur(10px);
        display: flex; flex-direction: column;
        transform: translateY(20px) scale(0.97); opacity: 0; pointer-events: none;
        transition: all 0.2s ease;
        box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    }
    #manolito-panel.manolito-abierto { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }

    .manolito-panel-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 14px; border-bottom: 1px solid var(--panel-border);
    }
    .manolito-panel-header strong { font-family: 'Rajdhani', sans-serif; font-size: 1rem; }
    .manolito-panel-header strong span { color: var(--cyan); }

    #manolito-mensajes { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .manolito-msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 0.83rem; line-height: 1.4; white-space: pre-line; }
    .msg-user { align-self: flex-end; background: var(--cyan); color: #051013; border-bottom-right-radius: 3px; }
    .msg-bot { align-self: flex-start; background: rgba(255,255,255,0.06); border-bottom-left-radius: 3px; }
    .msg-error { border: 1px solid var(--red); color: var(--red); background: rgba(255,0,60,0.08); }
    .msg-thinking { color: var(--text-muted); font-style: italic; }

    .manolito-input-row { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--panel-border); }
    #manolito-input {
        flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border);
        color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem;
    }
    #manolito-send-btn {
        background: var(--cyan); border: none; color: #051013; border-radius: 8px;
        width: 38px; cursor: pointer; font-size: 1rem;
    }

    /* ---------- Modal legal ---------- */
    /* z-index por encima de TODO lo flotante (FAB emergencias 99998,
       chips PWA 1800...): si algo se dibuja encima, intercepta los toques
       y los botones del modal parecen muertos. */
    #legal-modal {
        display: none; position: fixed; inset: 0; z-index: 100000;
        background: rgba(2,4,8,0.82); backdrop-filter: blur(4px);
        align-items: center; justify-content: center;
        overscroll-behavior: contain;
    }
    #legal-modal .legal-box {
        background: #0c1119; border: 1px solid var(--panel-border); border-radius: 16px;
        width: min(640px, 92vw); max-height: 94vh; max-height: 94dvh;
        display: flex; flex-direction: column;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 4px 16px rgba(0,0,0,0.5);
    }
    /* Cabecera y pie fijos; el contenido es el ÚNICO que se encoge y scrolla.
       Sin flex:1 + min-height:0 el contenedor no se encoge nunca (min-height:auto
       de flex), la caja desborda el max-height y el botón de aceptar queda
       cortado fuera de la pantalla: de ahí el "no puedo darle a OK". */
    .legal-box-header { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--panel-border); }
    #legal-content-container {
        flex: 1 1 auto; min-height: 0;
        padding: 18px 20px; overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
        font-size: 0.85rem; line-height: 1.6; color: var(--text-muted);
        overflow-wrap: break-word; word-break: break-word; max-width: 100%;
        scrollbar-width: none; -ms-overflow-style: none; /* sin barra fea */
    }
    #legal-content-container::-webkit-scrollbar { width: 0; height: 0; display: none; }
    #legal-content-container * { max-width: 100%; }
    #legal-content-container ul { padding-left: 18px; }
    #legal-content-container h2 { color: var(--text); font-size: 1.1rem; }
    #legal-content-container h3 { color: var(--cyan); font-size: 0.95rem; margin-top: 18px; }
    #legal-content-container a { color: var(--cyan); }
    .legal-box-footer { flex: 0 0 auto; padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--panel-border); }
    .legal-box-footer .btn-primary { margin-bottom: 0; }

    /* ---------- Móvil: bottom-sheet, dedos gordos, safe-areas ---------- */
    @media (max-width: 640px) {
        /* Sin zoom fantasma al tocar dos veces ni al enfocar inputs (iOS) */
        body { touch-action: manipulation; }
        input, select, textarea, button { font-size: 16px; }

        /* Dashboard como hoja inferior. OPACO en móvil: si es translúcido,
           los controles del mapa (zoom, GPS…) se ven a través y parecen
           "decoración" pegada al texto. dvh = altura real visible en iOS. */
        #dashboard {
            width: 100vw; right: 0; left: 0; top: auto; bottom: 0;
            max-height: 62vh;
            max-height: 58dvh;
            background: rgba(13, 18, 26, 0.97);
            border-radius: 20px 20px 0 0;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            border-left: none; border-right: none; border-bottom: none;
        }
        #dashboard.closed { transform: translateY(110%); }

        /* Hoja EXPANDIDA: por encima de los botones flotantes (chat, PWA,
           emergencia…), que quedan detrás mientras se lee y reaparecen al
           colapsar. Así nada se dibuja encima del contenido del panel. */
        #dashboard:not(.chip-movil):not(.closed) { z-index: 1900; }

        /* Chip colapsado: solo la cabecera (marca + ✕), a un toque de altura.
           Tocar la barra lo vuelve a desplegar; se puede navegar con el mapa. */
        #dashboard.chip-movil {
            max-height: none; height: auto; overflow: hidden;
            padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            cursor: pointer;
        }
        #dashboard.chip-movil > *:not(.dashboard-header) { display: none; }
        #dashboard.chip-movil .dashboard-header { margin-bottom: 0; }

        #reopen-dashboard-btn {
            right: 12px; top: auto;
            bottom: calc(160px + env(safe-area-inset-bottom, 0px));
            padding: 12px 16px;
        }

        /* Botones con objetivo táctil >= 44px (Apple HIG / WCAG) */
        .icon-btn { width: 44px; height: 44px; font-size: 1.1rem; }
        .btn-primary { padding: 14px; font-size: 1rem; }
        #toggle-mode { padding: 12px; font-size: 0.9rem; }

        /* Chat: casi a pantalla completa, cómodo con teclado. z-index 1900:
           por encima del raíl de herramientas (≤1800) mientras está abierto;
           la emergencia (99998) siempre queda accesible por encima. */
        #manolito-panel {
            width: calc(100vw - 16px); right: 8px; left: 8px;
            bottom: calc(150px + env(safe-area-inset-bottom, 0px));
            height: min(60vh, 520px);
            z-index: 1900;
        }
        /* El FAB sube por encima del chip del dashboard (~65px): en 18px
           le pisaba el botón ✕ de la barra. */
        #manolito-toggle-btn {
            bottom: calc(78px + env(safe-area-inset-bottom, 0px));
            right: 14px; width: 60px; height: 60px;
        }
        #manolito-input { padding: 12px; }

        /* Selector de idioma bajo el zoom de Leaflet, con safe-area */
        #language-select-wrap {
            top: calc(12px + env(safe-area-inset-top, 0px)); left: 54px;
        }
        #language-select { padding: 10px 12px; font-size: 16px; }

        /* El porcentaje respira mejor en pantallas pequeñas */
        #ui-percent { font-size: 2rem; }

        /* Modal legal como hoja inferior: ancho total, pegada abajo,
           esquinas redondeadas arriba y respeto de la safe-area. */
        #legal-modal { align-items: flex-end; }
        #legal-modal .legal-box {
            width: 100%; max-width: 100vw;
            max-height: 92vh; max-height: 92dvh;
            border-radius: 20px 20px 0 0;
            border-left: none; border-right: none; border-bottom: none;
        }
